<style>
/* Single deliberate light look: the Lived palette on white, stage 390×844 scaled to the phone */
:root{--bg:#fff;--fg:#000;color-scheme:light}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
#stage{position:fixed;inset:0}

button:focus-visible{outline:3px solid #000;outline-offset:3px}

.app{font-family:"Helvetica Neue",Helvetica,Inter,Arial,sans-serif;color:#000;background:#fff}

.app{width:100%;height:100%;position:relative;overflow:hidden;background:#fff}
.k-pain{--c:#3F5BD3;--ink:#fff}

/* ── the four squares: one object, from logo to week ── */
.quad{position:absolute;box-sizing:border-box;border:none;padding:0;margin:0;background:var(--c);color:var(--ink);overflow:hidden;
  transition:left 1s cubic-bezier(.65,0,.35,1),top 1s cubic-bezier(.65,0,.35,1),width 1s cubic-bezier(.65,0,.35,1),height 1s cubic-bezier(.65,0,.35,1),border-radius 1s cubic-bezier(.65,0,.35,1),transform 1s cubic-bezier(.65,0,.35,1);z-index:1;text-align:left;will-change:left,top,width,height,transform;contain:layout paint;backface-visibility:hidden}
.quad:nth-child(2){transition-delay:.05s}.quad:nth-child(3){transition-delay:.1s}.quad:nth-child(4){transition-delay:.15s}

.s-day .cells{gap:2px}.s-day .cell{font-size:10px;padding:5px}.s-day .cell small,.s-day .cell .plus{display:none}
.s-week .cells{gap:1px}.s-week .cell{font-size:0;padding:0}.s-week .cell *{display:none}

/* positions per state (index = L I V E) */

.s-day{width:139px;height:139px;border-radius:4px}
.s-day.i0{left:55px;top:214px}.s-day.i1{left:197px;top:214px}.s-day.i2{left:55px;top:356px}.s-day.i3{left:197px;top:356px}
.s-week{width:19px;height:19px;border-radius:2px}

.dot{position:absolute;left:166px;top:353px;width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;z-index:2;transition:transform .7s cubic-bezier(.65,0,.35,1),opacity .5s cubic-bezier(.65,0,.35,1);animation:dpop .8s cubic-bezier(.22,1,.36,1) 1.1s both}

.layer{position:absolute;inset:0;padding:56px 30px 40px;box-sizing:border-box;display:flex;flex-direction:column;pointer-events:none;z-index:2}

.pill{min-height:56px;border-radius:999px;border:none;background:#000;color:#fff;font-size:17px;width:100%;transition:transform .2s cubic-bezier(.2,.8,.2,1)}

/* zoomed panel */
.panel{color:var(--ink)}
.top{display:flex;align-items:center;min-height:44px}
.bk{display:flex;align-items:center;gap:10px;border:none;background:none;padding:0;min-height:44px;font-size:15px;color:var(--ink)}

.pbar .p0{width:6%}.pbar .p1{width:25%}.pbar .p2{width:50%}.pbar .p3{width:75%}.pbar .p4{width:100%}

.pgrid{position:relative}
.owngrid{margin-top:8px}.owngrid:empty{display:none}
.opts.sq4{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opts.sq4 .opt{height:auto;min-height:0 !important;aspect-ratio:1;min-width:0;font-size:13px;padding:6px;overflow-wrap:anywhere}
.opts.sq4 .opt .ck{top:5px;right:5px;width:18px;height:18px}
.own{position:absolute;left:calc(33.333% - 1.333px);top:50%;translate:-50% -50%;width:84px;height:84px;box-sizing:border-box;border-radius:50%;border:5px solid var(--c);background:#fff;color:#000;font-size:12px;line-height:1.15;padding:6px;z-index:2;animation:rise .6s cubic-bezier(.22,1,.36,1) .9s both;transition:transform .2s cubic-bezier(.2,.8,.2,1)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);pointer-events:auto;animation:fadein .3s ease both;z-index:5}
.sheet{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,520px);box-sizing:border-box;bottom:0;padding-bottom:calc(34px + env(safe-area-inset-bottom,0px));background:#fff;color:#000;border-radius:22px 22px 0 0;padding:24px 24px 34px;display:flex;flex-direction:column;gap:12px;pointer-events:auto;z-index:6;animation:sheetup .45s cubic-bezier(.22,1,.36,1) both}

@keyframes fadein{from{opacity:0}to{opacity:1}}

@keyframes ring{from{box-shadow:0 0 0 0 var(--ink)}to{box-shadow:0 0 0 14px transparent}}
.opt .ck{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--c);display:none;align-items:center;justify-content:center}
.opt.on .ck{display:flex;animation:ckin .35s cubic-bezier(.22,1,.36,1) both}
.opt .ck{color:var(--ink)}
@keyframes ckin{from{transform:scale(.4);opacity:0}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.opt:nth-child(1){animation-delay:.42s}.opt:nth-child(2){animation-delay:.46s}.opt:nth-child(3){animation-delay:.5s}.opt:nth-child(4){animation-delay:.54s}.opt:nth-child(5){animation-delay:.58s}.opt:nth-child(6){animation-delay:.62s}.opt:nth-child(7){animation-delay:.66s}.opt:nth-child(8){animation-delay:.7s}.opt:nth-child(9){animation-delay:.74s}.opt:nth-child(10){animation-delay:.78s}.opt:nth-child(11){animation-delay:.82s}.opt:nth-child(12){animation-delay:.86s}
.mindwrap{flex:1;display:flex;flex-direction:column;min-height:0}

.drow{flex:1;min-height:0;display:grid;grid-template-columns:76px repeat(4,minmax(0,1fr));gap:6px;align-items:stretch;border-radius:8px}

.dlab{align-self:center;font-size:13px;color:var(--ink)}

.brushes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.brush{min-height:48px;border-radius:999px;border:1.5px solid transparent;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink);transition:border-color .2s,background-color .2s}

.readout{font-size:15px;line-height:1.35;color:var(--ink);margin:12px 0 12px;height:5.4em;overflow:hidden}

.tank.full .tb:nth-child(2){animation-delay:0.00s}.tank.full .tb:nth-child(3){animation-delay:0.00s}.tank.full .tb:nth-child(4){animation-delay:0.00s}.tank.full .tb:nth-child(5){animation-delay:0.06s}.tank.full .tb:nth-child(6){animation-delay:0.06s}.tank.full .tb:nth-child(7){animation-delay:0.06s}.tank.full .tb:nth-child(8){animation-delay:0.06s}.tank.full .tb:nth-child(9){animation-delay:0.12s}.tank.full .tb:nth-child(10){animation-delay:0.12s}.tank.full .tb:nth-child(11){animation-delay:0.12s}.tank.full .tb:nth-child(12){animation-delay:0.12s}.tank.full .tb:nth-child(13){animation-delay:0.18s}.tank.full .tb:nth-child(14){animation-delay:0.18s}.tank.full .tb:nth-child(15){animation-delay:0.18s}.tank.full .tb:nth-child(16){animation-delay:0.18s}.tank.full .tb:nth-child(17){animation-delay:0.24s}.tank.full .tb:nth-child(18){animation-delay:0.24s}.tank.full .tb:nth-child(19){animation-delay:0.24s}.tank.full .tb:nth-child(20){animation-delay:0.24s}

/* day + week */

/* ── colour screens: white page, colour only on what you pick (from Figma) ── */
.k-pain,.k-heart{--on:#fff}.k-mind,.k-body{--on:#000}

.own.has small{display:none}
.own.has .ownt{font-size:15px;line-height:1.15;max-width:86%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.own .ck{position:absolute;top:6%;right:6%;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--c);display:none;align-items:center;justify-content:center}
.own.has .ck{display:flex;animation:ckin .35s cubic-bezier(.22,1,.36,1) both}
.own.has{box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--c);animation:jelly .7s cubic-bezier(.33,0,.2,1)}
.ownchips{display:flex;flex-wrap:wrap;gap:8px}
.ownchip{min-height:44px;padding:0 14px;border-radius:999px;border:none;background:var(--c,#3F5BD3);color:#fff;font-size:16px;display:flex;align-items:center;gap:8px}
.ownchip span{font-size:20px;line-height:1;opacity:.9}
.cells.egrid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:3px}
.cells.egrid .cell{border-radius:3px}
.cells.egrid .cell.off{background:#F6F8EC;box-shadow:none}
.s-week .cells.egrid .cell{box-shadow:none;border-radius:0}
.s-week .cells.egrid{gap:0}
.cells.patch{display:block;background:#fff}
.s-day .cell.first{background:#F1F2F4}
.cells.patch .cell{position:absolute;padding:0}
.s-day .cells.patch .cell,.s-week .cells.patch .cell{padding:0}

/* option layout */
.opt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.osub{font-size:11px;line-height:1.1;opacity:.9}.osub:empty{display:none}
.hint2{font-size:13px;color:#555;margin:8px 0 0}.hint2:empty{display:none}
.layer.panel .opt .onm,.layer.panel .opt .osub{position:relative;z-index:1}

/* feelings: tile fills from the bottom with intensity */
.layer.panel .opt.feel{overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.layer.panel .opt.feel::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--f,0%);background:var(--c);transition:height .35s cubic-bezier(.22,1,.36,1);z-index:0}
.layer.panel .opt.feel.on{background:#FADCDD;color:#000}
.layer.panel .opt.feel.on.hi{color:#fff}
.layer.panel.k-body .opt.feel.on{background:#ECE6FC}
.layer.panel.k-body .opt.feel.on.hi{color:#000}
.layer.panel.k-body .opt.feel.on{box-shadow:none}
.layer.panel .opt.feel .onm,.layer.panel .opt.feel .osub{position:relative;z-index:1}
.layer.panel .opt.feel .osub{font-size:12px;font-variant-numeric:tabular-nums}
.layer.panel .opt.feel .ck,.layer.panel .opt.feel .osub{display:none !important}

/* body: groups first, then the symptoms inside */
.catgrid{position:relative;flex:1 1 auto;min-height:0;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.cat{position:relative;border:none;border-radius:10px;background:#F1F2F4;color:#000;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;overflow:hidden;animation:rise .6s cubic-bezier(.22,1,.36,1) both;transition:background-color .25s,transform .2s}
.cat:nth-child(2){animation-delay:0.05s}.cat:nth-child(3){animation-delay:0.10s}.cat:nth-child(4){animation-delay:0.15s}.cat:nth-child(5){animation-delay:0.20s}.cat:nth-child(6){animation-delay:0.25s}.cat:nth-child(7){animation-delay:0.30s}
.cat:active{transform:scale(.97)}
.cat .cname{font-size:17px;line-height:1.15;position:relative;z-index:1}
.cat .csub{font-size:12px;line-height:1.3;color:#444;position:relative;z-index:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat.has{background:#ECE6FC}
.cat .cmarks{position:absolute;left:12px;right:12px;bottom:10px;height:28%;display:flex;gap:4px;align-items:flex-end}
.cat .cmarks i{flex:1;max-width:26px;background:var(--c);border-radius:3px;display:block}
.cat:nth-child(7){grid-column:1 / -1}
.catgrid .own{position:relative;left:auto;top:auto;translate:none;width:auto;height:100%;max-width:100%;aspect-ratio:1;justify-self:center;align-self:center;border:none;box-sizing:border-box}
.catwrap{display:flex;flex-direction:column;flex:1;min-height:0;animation:in .5s cubic-bezier(.22,1,.36,1) both}
.catback{align-self:flex-start;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;margin-top:14px;border:none;border-radius:999px;background:#F1F2F4;font-size:15px;color:#000}
.subgrid{margin-top:12px}

/* body groups: 3 on top, 1 · circle · 1, then 2 centred */
.layer.panel .cat7{grid-template-columns:repeat(6,minmax(0,1fr))}
.layer.panel .cat7 > *{grid-column:span 2}
.layer.panel .cat7 > :nth-child(7){grid-column:2 / span 2}
.layer.panel .cat7 .opt{animation:rise .6s cubic-bezier(.22,1,.36,1) both}

/* body groups: 3 across, circle in the centre, aligned to both edges */
.layer.panel .brick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:10px;row-gap:10px;margin-top:20px;width:100%;max-width:none !important}
.layer.panel .brick > *{aspect-ratio:1;height:auto;min-height:0 !important;min-width:0}
.layer.panel .brick > :nth-child(1){grid-row:1;grid-column:1}
.layer.panel .brick > :nth-child(2){grid-row:1;grid-column:2}
.layer.panel .brick > :nth-child(3){grid-row:1;grid-column:3}
.layer.panel .brick > :nth-child(4){grid-row:2;grid-column:1}
.layer.panel .brick > :nth-child(5){grid-row:2;grid-column:2}
.layer.panel .brick > :nth-child(6){grid-row:2;grid-column:3}
.layer.panel .brick > :nth-child(7){grid-row:3;grid-column:1}
.layer.panel .brick > :nth-child(8){grid-row:3;grid-column:3}
.layer.panel .brick .opt{font-size:14px;line-height:1.15;padding:6px;animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.layer.panel .brick .own{position:relative;left:auto;top:auto;translate:none;width:100%;height:auto;font-size:14px;animation:rise .6s cubic-bezier(.22,1,.36,1) .3s both}
.layer.panel .brick > :nth-child(6){animation-delay:.12s}.layer.panel .brick > :nth-child(7){animation-delay:.16s}.layer.panel .brick > :nth-child(8){animation-delay:.2s}

/* ── your hEDS map + your weeks (from your sketches) ── */
#ext{position:fixed;inset:0;pointer-events:none;z-index:20}
.xs-screen{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s cubic-bezier(.65,0,.35,1);overflow:hidden}
.xs-screen.on{opacity:1;pointer-events:auto}
.xcol{position:absolute;top:0;bottom:0;box-sizing:border-box;display:flex;flex-direction:column}
.xscroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.xcol > *{flex-shrink:0}
.xbk{--ink:#000;--c:#fff}
.xbk i{background:#000;color:#fff}
.xbottom{margin-top:auto;padding-top:16px;position:sticky;bottom:0;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 30%)}
.xbrand{font-size:17px;letter-spacing:-0.01em}
.xlink{border:none;background:#F1F2F4;border-radius:999px;min-height:40px;padding:0 16px;font:inherit;font-size:15px;color:#000;cursor:pointer}
.xs-screen .top{display:flex;align-items:center;min-height:44px}
.lv{font-family:'Helvetica Neue',Helvetica,Inter,Arial,sans-serif;color:#000}
.lv .cell{position:absolute;left:0;top:0;border:none;border-radius:8px;padding:6px 7px;font:inherit;font-size:12px;line-height:1.15;text-align:left;display:flex;align-items:flex-end;cursor:pointer;transition:transform .6s cubic-bezier(.34,1.4,.64,1),opacity .3s,background-color .3s,width .5s,height .5s,outline-color .2s;outline:2px dashed transparent;outline-offset:-3px;overflow-wrap:break-word;hyphens:manual;-webkit-tap-highlight-color:transparent;box-sizing:border-box;animation:none;grid-column:auto}
.lv .cell{flex-direction:row;justify-content:flex-start;align-items:flex-end}
.lv .cell.jig{animation:jl .7s cubic-bezier(.33,0,.2,1)}
@keyframes jl{0%{scale:1}20%{scale:1.12 .9}40%{scale:.92 1.08}60%{scale:1.04 .97}100%{scale:1}}
.lv .seg{border:none;font:inherit;font-size:14px;padding:0 14px;border-radius:999px;cursor:pointer;min-height:34px}
.lv .tx{border:none;background:none;font:inherit;font-size:14px;color:#000;text-decoration:underline;padding:6px 0;cursor:pointer;min-height:36px}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;transition-duration:1ms !important;transition-delay:0ms !important}}

</style>
<style id="dyn"></style>
<div id="stage"></div>
<div id="ext">
 <div class="xs-screen" id="mapScreen" aria-label="Your hEDS">
  <div class="xcol lv xscroll">
   <div class="top"><button class="bk xbk" id="m-back" aria-label="Back"><i><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4L3 8l4 4"></path></svg></i></button></div>
   <h1 class="h" style="margin-top:12px">Your hEDS</h1>
   <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px">
    <span id="m-sb" style="font-size:14px;color:#444">Tap what you live with</span>
    <span style="display:flex;background:#F1F2F4;border-radius:999px;padding:3px"><button class="seg" id="m-sAll">All</button><button class="seg" id="m-sMine">Mine</button></span>
   </div>
   <div id="m-gr" style="position:relative;margin-top:14px;transition:height .5s cubic-bezier(.34,1.2,.64,1)"><svg id="m-ln" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible"></svg></div>
   <div id="m-cd" style="background:#F1F2F4;border-radius:14px;padding:14px;margin-top:14px;box-sizing:border-box;font-size:14px;line-height:1.4"></div>

  </div>
 </div>
 <div class="xs-screen" id="weeksScreen" aria-label="Your weeks">

   <div id="w-hd" class="h" style="margin-top:12px;min-height:70px">Your last<br>8 weeks</div>

   <div id="w-cd" style="background:#F1F2F4;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;margin-top:12px;min-height:60px;box-sizing:border-box">Tap a day to find the days like it.</div>

<template id="tpl">
<div class="{{appCls}}" id="appEl">

  <sc-for list="{{quads}}" as="q" hint-placeholder-count="4">
    <button class="{{q.cls}}" onClick="{{q.tap}}" aria-label="{{q.aria}}">
      <span class="letter">{{q.letter}}</span>
      <span class="{{q.cellsCls}}">
        <sc-for list="{{q.cells}}" as="c" hint-placeholder-count="2">
          <span class="{{c.cls}}" style="{{c.style}}"><small>{{c.sys}}</small><span>{{c.name}}</span></span>
        </sc-for>
      </span>
    </button>
  </sc-for>
  <div class="{{dotCls}}" aria-hidden="true">D</div>

  <!-- splash -->
  <sc-if value="{{isSplash}}" hint-placeholder-val="{{ false }}">
    <div class="layer" data-k="splash" style="pointer-events: auto" onClick="{{goIntro}}" aria-label="Lived. Tap to continue"></div>
  </sc-if>

  <!-- intro: the logo squares scatter into place -->
  <sc-if value="{{isIntro}}" hint-placeholder-val="{{ false }}">
    <div class="layer" data-k="intro">
      <h1 class="h in" style="animation-delay: .5s">For adults with hEDS to understand their medical condition.</h1>
      <div class="bottom in" style="animation-delay: 1s"><button class="pill" onClick="{{goWeek}}">Start now</button></div>
    </div>
  </sc-if>

  <!-- home -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div class="layer" data-k="home">
      <div class="top in" style="animation-delay: .3s; --ink: #000; --c: #fff">
        <button class="bk" onClick="{{goWeek}}" aria-label="Back to your weeks"><i><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4L3 8l4 4"></path></svg></i></button>
      </div>
      <h1 class="h in" style="animation-delay: .4s; margin-top: 12px">Today:<br>{{homeSub}}</h1>
      <div class="bottom in" style="animation-delay: .6s">
        <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><span class="toast">Saved to your week</span></sc-if>
        <sc-if value="{{hasItems}}" hint-placeholder-val="{{ false }}"><button class="pill" onClick="{{goDay}}">This is my day</button></sc-if>
      </div>
    </div>
  </sc-if>

  <!-- zoomed into one colour -->
  <sc-if value="{{isZoom}}" hint-placeholder-val="{{ false }}">
    <div class="{{panelCls}}" data-k="{{panelCls}}">
      <div class="top in" style="animation-delay: .35s">
        <button class="bk" onClick="{{goHome}}" aria-label="Back to today"><i><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4L3 8l4 4"></path></svg></i></button>
        <div class="pbar" role="progressbar" aria-label="{{pLabel}}"><i class="{{pCls}}"></i></div>
        <span class="mapgap"></span>
      </div>

      <sc-if value="{{zPain}}" hint-placeholder-val="{{ false }}">
        <div data-k="zPain">
          <h1 class="h in" style="animation-delay: .4s; margin-top: 12px">Today:<br>Tap where you feel pain</h1>
          <div class="opts sq3 pgrid">
            <sc-for list="{{painOptsA}}" as="o" hint-placeholder-count="7">
              <button class="{{o.cls}}" onClick="{{o.tap}}" aria-pressed="{{o.on}}" aria-label="{{o.aria}}" data-key="{{o.key}}" data-name="{{o.name}}"><span class="onm">{{o.name}}</span><span class="osub">{{o.sub}}</span><span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
            </sc-for>
            <button class="{{ownCls}}" onClick="{{openOwn}}" aria-label="{{ownAria}}"><small>{{ownCap}}</small><span class="ownt">{{ownText}}</span><span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
            <sc-for list="{{painOptsB}}" as="o" hint-placeholder-count="4">
              <button class="{{o.cls}}" onClick="{{o.tap}}" aria-pressed="{{o.on}}" aria-label="{{o.aria}}" data-key="{{o.key}}" data-name="{{o.name}}"><span class="onm">{{o.name}}</span><span class="osub">{{o.sub}}</span><span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{zHeart}}" hint-placeholder-val="{{ false }}">
        <div data-k="zHeart">
          <h1 class="h in" style="animation-delay: .4s; margin-top: 12px">Today:<br>Tap what you feel</h1>
          <p class="hint2 in" style="animation-delay: .45s">Then slide up on it to show how strong</p>
          <div class="opts sq3 pgrid g3">
            <sc-for list="{{feelA}}" as="o" hint-placeholder-count="4">
              <button class="{{o.cls}}" style="{{o.style}}" onClick="{{o.tap}}" aria-pressed="{{o.on}}" aria-label="{{o.aria}}" data-feel="{{o.name}}" data-fkey="{{o.key}}"><span class="onm">{{o.name}}</span><span class="osub">{{o.sub}}</span><span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
            </sc-for>
            <button class="{{ownCls}}" onClick="{{openOwn}}" aria-label="{{ownAria}}"><small>{{ownCap}}</small><span class="ownt">{{ownText}}</span><span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
            <sc-for list="{{feelB}}" as="o" hint-placeholder-count="4">
              <button class="{{o.cls}}" style="{{o.style}}" onClick="{{o.tap}}" aria-pressed="{{o.on}}" aria-label="{{o.aria}}" data-feel="{{o.name}}" data-fkey="{{o.key}}"><span class="onm">{{o.name}}</span><span class="osub">{{o.sub}}</span><span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{zMind}}" hint-placeholder-val="{{ false }}">
        <div data-k="zMind" class="mindwrap">
          <h1 class="h in" style="animation-delay: .4s; margin-top: 12px">Today:<br>Fill your energy level</h1>
          <div class="{{tankCls}}" data-tank="1" role="slider" tabindex="0" aria-label="Energy level, fill the squares" aria-valuemin="0" aria-valuemax="20" aria-valuenow="{{enNum}}" aria-valuetext="{{lvName}}">
            <sc-for list="{{tank}}" as="t" hint-placeholder-count="20"><span class="{{t.cls}}"></span></sc-for>
          </div>
          <div class="tread in" style="animation-delay: .6s"><span class="big">{{lvName}}</span><span class="hint">{{lvHint}}</span></div>
        </div>
      </sc-if>

      <sc-if value="{{zBody}}" hint-placeholder-val="{{ false }}">
        <div data-k="zBody">
          <sc-if value="{{bodyCats}}" hint-placeholder-val="{{ true }}"><h1 class="h in" style="animation-delay: .4s; margin-top: 12px">Today:<br>Tap any body reactions</h1></sc-if>
          <sc-if value="{{bodyIn}}" hint-placeholder-val="{{ false }}"><h1 class="h in" style="animation-delay: .1s; margin-top: 12px">{{bodyHead}}</h1></sc-if>
          <p class="hint2 in" style="animation-delay: .45s">{{bodyHint}}</p>
          <sc-if value="{{bodyCats}}" hint-placeholder-val="{{ true }}">
            <div class="opts brick" data-k="cats">
              <sc-for list="{{catsA}}" as="c" hint-placeholder-count="4">
                <button class="{{c.cls}}" onClick="{{c.tap}}" aria-label="{{c.aria}}"><span class="onm">{{c.name}}</span><span class="osub">{{c.sub}}</span></button>
              </sc-for>
              <button class="{{ownCls}}" onClick="{{openOwn}}" aria-label="{{ownAria}}"><small>{{ownCap}}</small><span class="ownt">{{ownText}}</span><span class="ck"></span></button>
              <sc-for list="{{catsB}}" as="c" hint-placeholder-count="3">
                <button class="{{c.cls}}" onClick="{{c.tap}}" aria-label="{{c.aria}}"><span class="onm">{{c.name}}</span><span class="osub">{{c.sub}}</span></button>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{bodyIn}}" hint-placeholder-val="{{ false }}">
            <div data-k="{{catKey}}" class="catwrap">
              <button class="catback" onClick="{{catBack}}" aria-label="Back to groups"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4L3 8l4 4"></path></svg>All groups</button>
              <div class="opts sq3 subgrid">
                <sc-for list="{{bodySub}}" as="o" hint-placeholder-count="6">
                  <button class="{{o.cls}}" onClick="{{o.tap}}" aria-pressed="{{o.on}}" aria-label="{{o.aria}}"><span class="onm">{{o.name}}</span><span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ownOpen}}" hint-placeholder-val="{{ false }}">
        <div class="sheet-bg" onClick="{{closeOwn}}"></div>
        <div class="sheet" role="dialog" aria-label="{{ownQ}}">
          <label for="own-in">{{ownQ}}</label>
          <sc-if value="{{hasOwn}}" hint-placeholder-val="{{ false }}">
            <div class="ownchips"><sc-for list="{{ownChips}}" as="c" hint-placeholder-count="1"><button class="ownchip" onClick="{{c.remove}}" aria-label="{{c.aria}}">{{c.name}}<span aria-hidden="true">×</span></button></sc-for></div>
          </sc-if>
          <input id="own-in" type="text" maxlength="24" placeholder="{{ownPh}}" autocomplete="off">
          <div class="sheet-row"><button class="sheet-cancel" onClick="{{closeOwn}}">Cancel</button><button class="pill" onClick="{{addOwn}}">Add</button></div>
        </div>
      </sc-if>
      <div class="bottom donebar in" style="animation-delay: .7s"><button class="pill inv" onClick="{{goHome}}">Done</button></div>
    </div>
  </sc-if>

  <!-- the day, as one patchwork -->
  <sc-if value="{{isDay}}" hint-placeholder-val="{{ false }}">
    <div class="layer" data-k="day">
      <div class="in" style="animation-delay: .4s">
        <h1 class="h">This is your day.</h1>
        <p class="date">Monday 23 November · {{countWord}}</p>
      </div>
      <div class="poster-cap in" style="animation-delay: .8s"><span>Lived · 23.11</span><span>{{countWord}}</span></div>

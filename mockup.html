<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lived on iPhone</title>
<style>
  :root{--bg:#EDEDEF;--ink:#111;--muted:#666}
  html,body{height:100%;margin:0;background:var(--bg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink)}
  .stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:24px;box-sizing:border-box;flex-wrap:wrap}
  .wrap{width:calc(417px*var(--s,1));height:calc(876px*var(--s,1));flex:none}
  .phone{width:417px;height:876px;transform:scale(var(--s,1));transform-origin:0 0;position:relative;border-radius:68px;background:#1b1b1d;
    box-shadow:0 0 0 2px #3a3a3c inset,0 30px 80px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.15)}
  .screen{position:absolute;left:12px;top:12px;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#fff}
  .screen iframe{border:0;width:393px;height:852px;display:block}
  .island{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:3;pointer-events:none}
  .status{position:absolute;left:0;right:0;top:0;height:54px;z-index:2;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:4px 34px 0 46px;box-sizing:border-box;font-size:17px;font-weight:600;letter-spacing:-.2px}
  .status .icons{display:flex;gap:6px;align-items:center}
  .home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#000;z-index:3;pointer-events:none}
  .btn{position:absolute;background:#2c2c2e;border-radius:3px}
  .side{width:280px;font-size:15px;line-height:1.45}
  .side h1{font-weight:400;font-size:32px;letter-spacing:-.02em;margin:0 0 8px}
  .side p{color:var(--muted);margin:0 0 18px}
  .side button{display:block;width:100%;text-align:left;min-height:44px;margin:0 0 8px;padding:0 16px;border:none;border-radius:999px;background:#fff;font:inherit;color:var(--ink);cursor:pointer}
  .side button:hover{background:#f7f7f7}
  .side button.main{background:#000;color:#fff}
  @media (max-width:760px){.side{width:100%;max-width:417px}}
</style>
</head>
<body>
<div class="stage">
  <div class="wrap" id="wrap">
    <div class="phone" aria-label="iPhone showing the Lived prototype">
      <span class="btn" style="left:-3px;top:170px;width:4px;height:32px"></span>
      <span class="btn" style="left:-3px;top:230px;width:4px;height:62px"></span>
      <span class="btn" style="left:-3px;top:305px;width:4px;height:62px"></span>
      <span class="btn" style="right:-3px;top:260px;width:4px;height:100px"></span>
      <div class="screen">
        <div class="status"><span>9:41</span><span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 11.5l2.4-2.9a3.4 3.4 0 00-4.8 0z"/><path d="M8 5.6c1.8 0 3.4.7 4.6 1.9l1.3-1.5A8.2 8.2 0 008 3.5 8.2 8.2 0 002.1 6l1.3 1.5A6.4 6.4 0 018 5.6z"/><path d="M8 1.6c2.9 0 5.5 1.1 7.4 3l1.2-1.4A12 12 0 008 0 12 12 0 00-.6 3.2L.6 4.6A10.4 10.4 0 018 1.6z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" opacity=".4"/></svg>
        </span></div>
        <div class="island"></div>
        <iframe id="app" src="index.html#splash" title="Lived prototype"></iframe>
        <div class="home"></div>
      </div>
    </div>
  </div>
  <div class="side">
    <h1>Lived</h1>
    <p>The prototype running on an iPhone-sized screen. Tap and drag inside the phone like on a real one.</p>
    <button class="main" data-go="splash">Start from the beginning</button>
    <button data-go="history">How you’ve been lately</button>
    <button data-go="today">Add to today</button>
    <button data-go="map">Your hEDS</button>
  </div>
</div>
<script>
  var f=document.getElementById('app');
  document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){f.src='index.html?r='+Date.now()+'#'+b.getAttribute('data-go')}});
  function fit(){var s=Math.min(1,(window.innerHeight-48)/876,(window.innerWidth-48)/417);document.getElementById('wrap').style.setProperty('--s',s.toFixed(3));document.querySelector('.phone').style.setProperty('--s',s.toFixed(3))}
  window.addEventListener('resize',fit);fit();
</script>
</body>
</html>

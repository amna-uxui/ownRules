<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lived">
<meta name="theme-color" content="#ffffff">
</head>
<body>
<title>Lived</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
/* Single deliberate light look: the Lived palette on white, stage 390×844 scaled to the phone */
:root{--bg:#fff;--fg:#000;color-scheme:light}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
#stage{position:fixed;width:390px;height:844px;transform-origin:0 0}
button:focus-visible{outline:3px solid #000;outline-offset:3px}

.app{font-family:"Helvetica Neue",Helvetica,Inter,Arial,sans-serif;color:#000;background:#fff}
a{color:#000}a:hover{color:#333}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#fff}
.k-pain{--c:#3F5BD3;--ink:#fff}
.k-heart{--c:#E0141E;--ink:#fff}
.k-mind{--c:#D7EE6B;--ink:#000}
.k-body{--c:#AB98EE;--ink:#000}

/* ── the four squares: one object, from logo to week ── */
.quad{position:absolute;box-sizing:border-box;border:none;padding:0;margin:0;background:var(--c);color:var(--ink);overflow:hidden;
  transition:left .75s cubic-bezier(.7,0,.25,1),top .75s cubic-bezier(.7,0,.25,1),width .75s cubic-bezier(.7,0,.25,1),height .75s cubic-bezier(.7,0,.25,1),border-radius .75s cubic-bezier(.7,0,.25,1),transform .3s ease;z-index:1;text-align:left}
.quad:nth-child(2){transition-delay:.04s}.quad:nth-child(3){transition-delay:.08s}.quad:nth-child(4){transition-delay:.12s}
.quad:active{transform:scale(.98)}
.letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;color:#000;transition:opacity .3s}
.quad:not(.s-splash) .letter{opacity:0}
.cells{position:absolute;inset:0;display:grid;gap:3px;background:#fff;grid-auto-rows:minmax(0,1fr);transition:opacity .35s ease .35s, gap .5s}
.cols1{grid-template-columns:1fr}.cols2{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:1fr 1fr 1fr}
.cell{background:var(--c);color:var(--ink);padding:10px;font-size:14px;line-height:1.15;display:flex;flex-direction:column;justify-content:space-between;animation:split .55s cubic-bezier(.2,.9,.3,1.2) both;overflow:hidden}
.cell small{font-size:11px;opacity:.8}
.cell.first{font-size:17px}
.cell .plus{font-size:28px;line-height:1;font-weight:300}
@keyframes split{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.s-splash .cells,.s-full .cells,.s-mini .cells{opacity:0;transition-delay:0s}
.s-day .cells{gap:2px}.s-day .cell{font-size:10px;padding:5px}.s-day .cell small,.s-day .cell .plus{display:none}
.s-week .cells{gap:1px}.s-week .cell{font-size:0;padding:0}.s-week .cell *{display:none}

/* positions per state (index = L I V E) */
.s-splash{width:78px;height:78px;border-radius:6px}
.s-splash.i0{left:113px;top:300px}.s-splash.i1{left:199px;top:300px}.s-splash.i2{left:113px;top:386px}.s-splash.i3{left:199px;top:386px}
.s-home{width:161px;height:256px;border-radius:10px}
.s-home.i0{left:30px;top:176px}.s-home.i1{left:199px;top:176px}.s-home.i2{left:30px;top:440px}.s-home.i3{left:199px;top:440px}
.s-full{left:0;top:0;width:390px;height:844px;border-radius:0;z-index:1}
.s-full:active{transform:none}
.s-mini{width:18px;height:18px;border-radius:3px;z-index:3}
.s-mini.i0{left:320px;top:69px}.s-mini.i1{left:342px;top:69px}.s-mini.i2{left:320px;top:91px}.s-mini.i3{left:342px;top:91px}
.s-day{width:139px;height:139px;border-radius:4px}
.s-day.i0{left:55px;top:214px}.s-day.i1{left:197px;top:214px}.s-day.i2{left:55px;top:356px}.s-day.i3{left:197px;top:356px}
.s-week{width:19px;height:19px;border-radius:2px}
.s-week.i0{left:320px;top:330px}.s-week.i1{left:341px;top:330px}.s-week.i2{left:320px;top:351px}.s-week.i3{left:341px;top:351px}

.dot{position:absolute;left:166px;top:353px;width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;z-index:2;transition:transform .5s cubic-bezier(.2,.9,.3,1.3),opacity .3s;animation:dpop .5s cubic-bezier(.2,.9,.25,1.3) 1.1s both}
.dot.gone{transform:scale(0);opacity:0}
@keyframes dpop{from{transform:scale(0)}to{transform:scale(1)}}
.intro .quad{animation:drop .6s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes drop{from{opacity:0;transform:translateY(-50px) rotate(-14deg) scale(.6)}to{opacity:1;transform:none}}

/* ── text layers ── */
.layer{position:absolute;inset:0;padding:56px 30px 40px;box-sizing:border-box;display:flex;flex-direction:column;pointer-events:none;z-index:2}
.layer button,.layer .opt{pointer-events:auto}
.in{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.h{font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-0.02em;margin:0}
.date{font-size:14px;color:#444;margin:6px 0 0}
.hint{font-size:15px;color:#444;margin:0 0 14px;text-align:center}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.pill{min-height:56px;border-radius:999px;border:none;background:#000;color:#fff;font-size:17px;width:100%;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.pill:active{transform:scale(.96)}
.pill.inv{background:var(--ink);color:var(--c)}
.tagline{position:absolute;left:0;right:0;top:500px;text-align:center;font-size:18px;color:#444;margin:0}

/* zoomed panel */
.panel{color:var(--ink)}
.top{display:flex;align-items:center;min-height:44px}
.bk{display:flex;align-items:center;gap:10px;border:none;background:none;padding:0;min-height:44px;font-size:15px;color:var(--ink)}
.bk i{width:30px;height:30px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center}
.bk i{color:var(--c)}
.eyebrow{font-size:14px;opacity:.85;margin:26px 0 6px}
.opts{display:grid;gap:8px;margin-top:24px}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{position:relative;height:84px;border-radius:8px;border:none;font-size:15px;line-height:1.2;padding:8px;color:var(--ink);background:rgba(255,255,255,.18);transition:background-color .25s,color .25s,transform .2s cubic-bezier(.2,.8,.2,1);animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.k-mind .opt,.k-body .opt{background:rgba(255,255,255,.5)}
.opts.c2 .opt{height:112px;font-size:17px}
.opt.wide{grid-column:1 / -1;height:64px !important}
.opt:active{transform:scale(.95)}
.opt.on{background:var(--ink);color:var(--c)}
.opt.on::after{content:"";position:absolute;inset:0;border-radius:8px;animation:ring .6s ease-out}
@keyframes ring{from{box-shadow:0 0 0 0 var(--ink)}to{box-shadow:0 0 0 14px transparent}}
.opt .ck{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--c);display:none;align-items:center;justify-content:center}
.opt.on .ck{display:flex;animation:ckin .3s cubic-bezier(.2,.9,.3,1.5) both}
.opt .ck{color:var(--ink)}
@keyframes ckin{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.opt:nth-child(1){animation-delay:.42s}.opt:nth-child(2){animation-delay:.46s}.opt:nth-child(3){animation-delay:.5s}.opt:nth-child(4){animation-delay:.54s}.opt:nth-child(5){animation-delay:.58s}.opt:nth-child(6){animation-delay:.62s}.opt:nth-child(7){animation-delay:.66s}.opt:nth-child(8){animation-delay:.7s}.opt:nth-child(9){animation-delay:.74s}.opt:nth-child(10){animation-delay:.78s}.opt:nth-child(11){animation-delay:.82s}.opt:nth-child(12){animation-delay:.86s}
.lvs .opt{height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:17px;text-align:left}
.bars{display:flex;gap:4px}.bars b{width:8px;height:22px;border-radius:2px;background:currentColor;opacity:.25;display:block}.bars b.f{opacity:1}
.also{font-size:14px;margin:20px 0 0;opacity:.85}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.chips .opt{height:58px}

/* day + week */
.poster-cap{position:absolute;left:55px;right:55px;top:506px;display:flex;justify-content:space-between;font-size:13px;color:#444}
.weekrow{position:absolute;left:30px;right:30px;top:330px;display:grid;grid-template-columns:repeat(7,40px);justify-content:space-between}
.mini{width:40px;height:40px;display:grid;grid-template-columns:1fr 1fr;gap:2px;animation:in .5s ease both}
.mini b{display:block;border-radius:2px;background:var(--c)}
.mini b.split{background:linear-gradient(var(--c),var(--c)) 0 0/100% 45% no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/100% 45% no-repeat}
.mini b.off{background:#EDEDED}
.wk{position:absolute;left:30px;right:30px;top:378px;display:grid;grid-template-columns:repeat(7,40px);justify-content:space-between;font-size:12px;color:#666;text-align:center}
.notice{position:absolute;left:30px;right:30px;top:430px;border-top:1px solid #000;padding-top:14px;font-size:16px;line-height:1.4}
.notice small{display:block;font-size:12px;color:#666;margin-bottom:4px}
.toast{align-self:center;background:#000;color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;margin-bottom:10px;animation:in .4s ease both}

@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;transition-duration:1ms !important;transition-delay:0ms !important}}

</style>
<div id="stage"></div>
<template id="tpl">
<div class="{{appCls}}" id="appEl">

  <sc-for list="{{quads}}" as="q" hint-placeholder-count="4">
    <button class="{{q.cls}}" onClick="{{q.tap}}" aria-label="{{q.aria}}">
      <span class="letter">{{q.letter}}</span>
      <span class="{{q.cellsCls}}">
        <sc-for list="{{q.cells}}" as="c" hint-placeholder-count="2">
          <span class="{{c.cls}}"><small>{{c.sys}}</small><span>{{c.name}}</span></span>
        </sc-for>
      </span>
    </button>
  </sc-for>
  <div class="{{dotCls}}" aria-hidden="true">D</div>

  <!-- splash -->
  <sc-if value="{{isSplash}}" hint-placeholder-val="{{ false }}">
    <p class="tagline in" style="animation-delay: 1.7s">Your body, in your words.</p>
    <div class="layer" data-k="splash"><div class="bottom in" style="animation-delay: 2.2s"><button class="pill" onClick="{{goHome}}">Start</button></div></div>
  </sc-if>

  <!-- home -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div class="layer" data-k="home">
      <div class="in" style="animation-delay: .35s">
        <h1 class="h">{{homeTitle}}</h1>
        <p class="date">Sunday 23 November</p>
      </div>
      <div class="bottom in" style="animation-delay: .6s">
        <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><span class="toast">Saved to your week</span></sc-if>
        <sc-if value="{{noItems}}" hint-placeholder-val="{{ true }}"><p class="hint">Tap a colour. Add what you feel.</p></sc-if>
        <sc-if value="{{hasItems}}" hint-placeholder-val="{{ false }}"><button class="pill" onClick="{{goDay}}">This is my day</button></sc-if>
      </div>
    </div>
  </sc-if>

  <!-- zoomed into one colour -->
  <sc-if value="{{isZoom}}" hint-placeholder-val="{{ false }}">
    <div class="{{panelCls}}" data-k="{{panelCls}}">
      <div class="top in" style="animation-delay: .35s">
        <button class="bk" onClick="{{goHome}}"><i><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4L3 8l4 4"></path></svg></i>Today</button>
      </div>

      <sc-if value="{{zPain}}" hint-placeholder-val="{{ false }}">
        <div data-k="zPain">
          <p class="eyebrow in" style="animation-delay: .38s">Pain</p>
          <h1 class="h in" style="animation-delay: .4s">Where do you feel pain?</h1>
          <div class="opts c3">
            <sc-for list="{{painOpts}}" as="o" hint-placeholder-count="12">
              <button class="{{o.cls}}" onClick="{{o.tap}}" aria-pressed="{{o.on}}">{{o.name}}<span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{zHeart}}" hint-placeholder-val="{{ false }}">
        <div data-k="zHeart">
          <p class="eyebrow in" style="animation-delay: .38s">Dizziness &amp; heart</p>
          <h1 class="h in" style="animation-delay: .4s">What do you feel?</h1>
          <div class="opts c2">
            <sc-for list="{{heartOpts}}" as="o" hint-placeholder-count="5">
              <button class="{{o.cls}}" onClick="{{o.tap}}" aria-pressed="{{o.on}}">{{o.name}}<span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{zMind}}" hint-placeholder-val="{{ false }}">
        <div data-k="zMind">
          <p class="eyebrow in" style="animation-delay: .38s">Energy &amp; mind</p>
          <h1 class="h in" style="animation-delay: .4s">How's your energy?</h1>
          <div class="opts lvs">
            <sc-for list="{{levels}}" as="o" hint-placeholder-count="4">
              <button class="{{o.cls}}" onClick="{{o.tap}}" aria-pressed="{{o.on}}"><span class="bars"><sc-for list="{{o.bars}}" as="b" hint-placeholder-count="4"><b class="{{b}}"></b></sc-for></span>{{o.name}}<span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
            </sc-for>
          </div>
          <p class="also in" style="animation-delay: .6s">Also today?</p>
          <div class="chips">
            <sc-for list="{{mindOpts}}" as="o" hint-placeholder-count="3">
              <button class="{{o.cls}}" onClick="{{o.tap}}" aria-pressed="{{o.on}}">{{o.name}}<span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{zBody}}" hint-placeholder-val="{{ false }}">
        <div data-k="zBody">
          <p class="eyebrow in" style="animation-delay: .38s">Body reactions</p>
          <h1 class="h in" style="animation-delay: .4s">Anything else in your body?</h1>
          <div class="opts c2">
            <sc-for list="{{bodyOpts}}" as="o" hint-placeholder-count="5">
              <button class="{{o.cls}}" onClick="{{o.tap}}" aria-pressed="{{o.on}}">{{o.name}}<span class="ck"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></span></button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <div class="bottom in" style="animation-delay: .7s"><button class="pill inv" onClick="{{goHome}}">{{doneLabel}}</button></div>
    </div>
  </sc-if>

  <!-- the day, as one patchwork -->
  <sc-if value="{{isDay}}" hint-placeholder-val="{{ false }}">
    <div class="layer" data-k="day">
      <div class="in" style="animation-delay: .4s">
        <h1 class="h">This is your day.</h1>
        <p class="date">Sunday 23 November · {{count}} things</p>
      </div>
      <div class="poster-cap in" style="animation-delay: .8s"><span>Lived · 23.11</span><span>{{count}} cells</span></div>
      <div class="bottom in" style="animation-delay: .7s">
        <button class="pill" onClick="{{goWeek}}">Save my day</button>
        <button class="pill" style="background: none; color: #000; text-decoration: underline; min-height: 44px" onClick="{{goHome}}">Change something</button>
      </div>
    </div>
  </sc-if>

  <!-- the week -->
  <sc-if value="{{isWeek}}" hint-placeholder-val="{{ false }}">
    <div class="layer" data-k="week">
      <div class="in" style="animation-delay: .3s">
        <h1 class="h">Your week</h1>
        <p class="date">Every day becomes one tile.</p>
      </div>
      <div class="weekrow">
        <div class="mini" style="animation-delay: .5s"><b class="k-mind"></b><b class="k-heart split"></b><b class="k-pain"></b><b class="off"></b></div>
        <div class="mini" style="animation-delay: .56s"><b class="k-mind split"></b><b class="off"></b><b class="off"></b><b class="off"></b></div>
        <div class="mini" style="animation-delay: .62s"><b class="k-mind split"></b><b class="k-heart split"></b><b class="k-pain split"></b><b class="k-body"></b></div>
        <div class="mini" style="animation-delay: .68s"><b class="off"></b><b class="off"></b><b class="k-pain"></b><b class="k-body"></b></div>
        <div class="mini" style="animation-delay: .74s"><b class="k-mind"></b><b class="off"></b><b class="k-pain split"></b><b class="off"></b></div>
        <div class="mini" style="animation-delay: .8s"><b class="k-mind"></b><b class="k-heart split"></b><b class="off"></b><b class="k-body"></b></div>
        <div></div>
      </div>
      <div class="wk in" style="animation-delay: .6s"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span><u>S</u></span></div>
      <div class="notice in" style="animation-delay: 1.1s"><small>You noticed</small>Dizziness showed up on 4 of 7 days. On 3 of them, your energy was low too.</div>
      <div class="bottom in" style="animation-delay: .9s"><button class="pill" onClick="{{goHomeSaved}}">Back to today</button></div>
    </div>
  </sc-if>

</div>
</template>
<script>
const SVGNS="http://www.w3.org/2000/svg";
class DCLogic{constructor(p){this.props=p;this.state=null}setState(x){this.state=Object.assign({},this.state||{},x);schedule()}}
function ev(scope,expr){try{return Function(...Object.keys(scope),'return ('+expr.trim()+')')(...Object.values(scope))}catch(e){return undefined}}
function strip(v){return v.replace(/^\s*\{\{|\}\}\s*$/g,'')}
function bindText(str,scope){return str.replace(/\{\{(.*?)\}\}/g,(m,e)=>{const v=ev(scope,e);return v==null?'':v})}
function build(tpl,scope,parent,svg){
 for(const n of [...tpl.childNodes]){
  if(n.nodeType===3){parent.appendChild(document.createTextNode(bindText(n.textContent,scope)));continue}
  if(n.nodeType!==1)continue;
  const tag=n.tagName.toLowerCase();
  if(tag==='sc-if'){if(ev(scope,strip(n.getAttribute('value')))){const k=document.createComment('if');build(n,scope,parent,svg)}continue}
  if(tag==='sc-for'){const list=ev(scope,strip(n.getAttribute('list')))||[];const as=n.getAttribute('as');list.forEach(it=>build(n,Object.assign({},scope,{[as]:it}),parent,svg));continue}
  const isSvg=svg||tag==='svg';
  const el=isSvg?document.createElementNS(SVGNS,tag):document.createElement(tag);
  for(const a of n.attributes){
   if(a.name.toLowerCase()==='onclick'){el.__click=ev(scope,strip(a.value));continue}
   el.setAttribute(a.name,bindText(a.value,scope))}
  build(n,scope,el,isSvg);parent.appendChild(el)}
}
function sameNode(a,b){if(a.nodeType!==b.nodeType)return false;if(a.nodeType===3)return true;if(a.nodeName!==b.nodeName)return false;
 const ka=a.getAttribute('data-k'),kb=b.getAttribute('data-k');if(ka!==kb)return false;
 const la=(a.getAttribute('class')||'').split(' ')[0],lb=(b.getAttribute('class')||'').split(' ')[0];return la===lb}
function morph(oldP,newP){
 const o=[...oldP.childNodes],n=[...newP.childNodes];
 for(let i=0;i<n.length;i++){
  const nn=n[i],on=o[i];
  if(!on){oldP.appendChild(nn);continue}
  if(!sameNode(on,nn)){oldP.replaceChild(nn,on);continue}
  if(on.nodeType===3){if(on.nodeValue!==nn.nodeValue)on.nodeValue=nn.nodeValue;continue}
  for(const a of [...on.attributes])if(!nn.hasAttribute(a.name))on.removeAttribute(a.name);
  for(const a of [...nn.attributes])if(on.getAttribute(a.name)!==a.value)on.setAttribute(a.name,a.value);
  on.__click=nn.__click;
  morph(on,nn)}
 for(let i=o.length-1;i>=n.length;i--)oldP.removeChild(o[i]);
}
document.addEventListener('click',e=>{let t=e.target;while(t&&t!==document){if(t.__click){t.__click(e);return}t=t.parentNode}});
let pending=false;function schedule(){if(pending)return;pending=true;queueMicrotask(()=>{pending=false;paint()})}

class Component extends DCLogic {
  renderVals() {
    const start = this.props.start || 'splash';
    const lea = { pain: ['Knees', 'Hands'], heart: ['Dizziness', 'Racing heart'], level: 1, mind: ['Brain fog'], body: ['Nausea'] };
    const none = { pain: [], heart: [], level: null, mind: [], body: [] };
    const sysOf = { mind: 0, heart: 1, pain: 2, body: 3 };
    let defaults;
    if (start in sysOf) defaults = Object.assign({ screen: 'zoom', z: sysOf[start] }, start === 'mind' ? none : Object.assign({}, lea, { [start]: [] }));
    else if (start === 'home-filled' || start === 'day' || start === 'week') defaults = Object.assign({ screen: start === 'home-filled' ? 'home' : start, z: null }, lea);
    else defaults = Object.assign({ screen: start, z: null }, none);
    defaults.toast = false;
    const st = Object.assign(defaults, this.state || {});
    const set = (p) => this.setState(p);

    const systems = [
      { key: 'mind', k: 'k-mind', letter: 'L', name: 'Energy & mind', short: 'Energy' },
      { key: 'heart', k: 'k-heart', letter: 'I', name: 'Dizziness & heart', short: 'Heart' },
      { key: 'pain', k: 'k-pain', letter: 'V', name: 'Pain', short: 'Pain' },
      { key: 'body', k: 'k-body', letter: 'E', name: 'Body reactions', short: 'Body' }
    ];
    const levelNames = ['Empty', 'Low', 'Okay', 'Good'];
    const itemsOf = (s) => {
      if (s.key === 'mind') {
        const out = [];
        if (st.level !== null) out.push({ sys: 'Energy', name: levelNames[st.level] });
        st.mind.forEach((n) => out.push({ sys: 'Mind', name: n }));
        return out;
      }
      return st[s.key].map((n) => ({ sys: s.short, name: n }));
    };
    const scr = st.screen;
    const count = systems.reduce((a, s) => a + itemsOf(s).length, 0);

    const quads = systems.map((s, i) => {
      const items = itemsOf(s);
      let pos = scr === 'splash' ? 's-splash' : scr === 'home' ? 's-home' : scr === 'day' ? 's-day' : scr === 'week' ? 's-week' : (st.z === i ? 's-full' : 's-mini');
      const n = items.length;
      const cols = n <= 2 ? 1 : n <= 6 ? 2 : 3;
      const cells = n === 0
        ? [{ cls: 'cell first', sys: s.name, name: '+' }]
        : items.map((it) => ({ cls: 'cell', sys: it.sys, name: it.name }));
      return {
        cls: 'quad ' + s.k + ' ' + pos + ' i' + i,
        letter: s.letter,
        cellsCls: 'cells cols' + cols,
        cells,
        aria: s.name + (n ? ', ' + n + ' marked' : ', nothing yet'),
        tap: () => {
          if (scr === 'home' || (scr === 'zoom' && st.z !== i)) set({ screen: 'zoom', z: i, toast: false });
        }
      };
    });

    const toggle = (key, name) => {
      const arr = st[key];
      set({ [key]: arr.indexOf(name) >= 0 ? arr.filter((x) => x !== name) : arr.concat([name]) });
    };
    const opts = (key, names, wideLast) => names.map((n, i) => {
      const on = st[key].indexOf(n) >= 0;
      return { name: n, on, cls: 'opt' + (on ? ' on' : '') + (wideLast && i === names.length - 1 ? ' wide' : ''), tap: () => toggle(key, n) };
    });
    const levels = levelNames.map((n, i) => ({
      name: n, on: st.level === i, cls: 'opt' + (st.level === i ? ' on' : ''),
      bars: [0, 1, 2, 3].map((d) => (d <= i ? 'f' : '')),
      tap: () => set({ level: st.level === i ? null : i })
    }));
    const zs = st.z !== null ? systems[st.z] : systems[0];
    const zCount = itemsOf(zs).length;

    return {
      appCls: 'app' + (scr === 'splash' ? ' intro' : ''),
      quads,
      dotCls: scr === 'splash' ? 'dot' : 'dot gone',
      isSplash: scr === 'splash', isHome: scr === 'home', isZoom: scr === 'zoom', isDay: scr === 'day', isWeek: scr === 'week',
      zPain: zs.key === 'pain', zHeart: zs.key === 'heart', zMind: zs.key === 'mind', zBody: zs.key === 'body',
      panelCls: 'layer panel ' + zs.k,
      painOpts: opts('pain', ['Shoulders', 'Knees', 'Hips', 'Neck', 'Upper back', 'Hands', 'Fingers', 'Lower back', 'Wrists', 'Ribs', 'Belly', 'Head'], false),
      heartOpts: opts('heart', ['Dizziness', 'Racing heart', 'Near fainting', 'Breathless', 'Something else'], true),
      mindOpts: opts('mind', ['Brain fog', 'Headache', 'Low mood'], false),
      bodyOpts: opts('body', ['Bloating', 'Nausea', 'Flushing', 'Itching', 'Something else'], true),
      levels,
      doneLabel: zCount ? 'Done · ' + zCount + ' added' : 'Nothing here today',
      homeTitle: count ? count + ' things today' : 'Today',
      count, toast: st.toast,
      noItems: count === 0, hasItems: count > 0,
      goHome: () => set({ screen: 'home', z: null }),
      goHomeSaved: () => set({ screen: 'home', z: null, toast: true }),
      goDay: () => set({ screen: 'day' }),
      goWeek: () => set({ screen: 'week' })
    };
  }
}


const tpl=document.getElementById('tpl').content;
const params=(location.hash||'').slice(1);
const C=new Component({start:params||'splash'});
const root=document.getElementById('stage');
function paint(){const f=document.createElement('div');build(tpl,C.renderVals(),f,false);if(!root.firstChild){while(f.firstChild)root.appendChild(f.firstChild)}else morph(root,f)}
paint();
function fit(){const s=Math.min(window.innerWidth/390,window.innerHeight/844);const st=document.getElementById('stage');st.style.transform='scale('+s+')';st.style.left=((window.innerWidth-390*s)/2)+'px';st.style.top=((window.innerHeight-844*s)/2)+'px'}
window.addEventListener('resize',fit);fit();
</script>

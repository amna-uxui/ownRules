<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lived">
<meta name="theme-color" content="#ffffff">
</head>
<body>
<title>Lived</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
/* Single deliberate light look: the Lived palette on white, stage 390×844 scaled to the phone */
:root{--bg:#fff;--fg:#000;color-scheme:light}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
#stage{position:fixed;inset:0}
html.still .quad{transition:none !important}
/* jelly on touch: uses the separate `scale` property so it never fights tilt or movement */
@keyframes jelly{0%{scale:1 1}18%{scale:1.13 .87}36%{scale:.9 1.1}54%{scale:1.06 .94}72%{scale:.97 1.03}86%{scale:1.01 .99}100%{scale:1 1}}
.quad.jig{animation:jelly .75s cubic-bezier(.33,0,.2,1) both}

button:focus-visible{outline:3px solid #000;outline-offset:3px}

.app{font-family:"Helvetica Neue",Helvetica,Inter,Arial,sans-serif;color:#000;background:#fff}
a{color:#000}a:hover{color:#333}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{width:100%;height:100%;position:relative;overflow:hidden;background:#fff}
.k-pain{--c:#3F5BD3;--ink:#fff}
.k-heart{--c:#E0141E;--ink:#fff}
.k-mind{--c:#D7EE6B;--ink:#000}
.k-body{--c:#AB98EE;--ink:#000}

/* ── the four squares: one object, from logo to week ── */
.quad{position:absolute;box-sizing:border-box;border:none;padding:0;margin:0;background:var(--c);color:var(--ink);overflow:hidden;
  transition:left 1s cubic-bezier(.65,0,.35,1),top 1s cubic-bezier(.65,0,.35,1),width 1s cubic-bezier(.65,0,.35,1),height 1s cubic-bezier(.65,0,.35,1),border-radius 1s cubic-bezier(.65,0,.35,1),transform 1s cubic-bezier(.65,0,.35,1);z-index:1;text-align:left;will-change:left,top,width,height,transform;contain:layout paint;backface-visibility:hidden}
.quad:nth-child(2){transition-delay:.05s}.quad:nth-child(3){transition-delay:.1s}.quad:nth-child(4){transition-delay:.15s}
.quad:active{transform:scale(.98)}
.letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;color:#000;transition:opacity .5s cubic-bezier(.65,0,.35,1)}
.quad:not(.s-splash) .letter{opacity:0}
.cells{position:absolute;inset:0;display:grid;gap:3px;background:#fff;grid-auto-rows:minmax(0,1fr);transition:opacity .35s ease .35s, gap .5s}
.cols1{grid-template-columns:1fr}.cols2{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:1fr 1fr 1fr}
.cell{background:var(--c);color:var(--ink);padding:10px;font-size:14px;line-height:1.15;display:flex;flex-direction:column;justify-content:space-between;animation:split .7s cubic-bezier(.22,1,.36,1) both;overflow:hidden}
.cell small{font-size:11px;opacity:.8}
.cell.first{font-size:17px}
.cell .plus{font-size:28px;line-height:1;font-weight:300}
@keyframes split{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.s-splash .cells,.s-intro .cells,.s-full .cells,.s-mini .cells{opacity:0;transition-delay:0s}
.s-day .cells{gap:2px}.s-day .cell{font-size:10px;padding:5px}.s-day .cell small,.s-day .cell .plus{display:none}
.s-week .cells{gap:1px}.s-week .cell{font-size:0;padding:0}.s-week .cell *{display:none}

/* positions per state (index = L I V E) */
.s-splash{width:78px;height:78px;border-radius:6px}
.s-intro{border-radius:10px}
.s-intro.i1{transform:rotate(8deg)}
.s-intro.i1:active{transform:rotate(8deg) scale(.98)}
.s-splash.i0{left:113px;top:300px}.s-splash.i1{left:199px;top:300px}.s-splash.i2{left:113px;top:386px}.s-splash.i3{left:199px;top:386px}
.s-home{width:161px;height:256px;border-radius:10px}
.s-home.i0{left:30px;top:176px}.s-home.i1{left:199px;top:176px}.s-home.i2{left:30px;top:440px}.s-home.i3{left:199px;top:440px}
.s-full{left:0;top:0;width:390px;height:844px;border-radius:0;z-index:1}
.s-full:active{transform:none}
.s-mini{width:18px;height:18px;border-radius:3px;z-index:3}
.s-mini.i0{left:320px;top:69px}.s-mini.i1{left:342px;top:69px}.s-mini.i2{left:320px;top:91px}.s-mini.i3{left:342px;top:91px}
.s-day{width:139px;height:139px;border-radius:4px}
.s-day.i0{left:55px;top:214px}.s-day.i1{left:197px;top:214px}.s-day.i2{left:55px;top:356px}.s-day.i3{left:197px;top:356px}
.s-week{width:19px;height:19px;border-radius:2px}
.s-week.i0{left:320px;top:330px}.s-week.i1{left:341px;top:330px}.s-week.i2{left:320px;top:351px}.s-week.i3{left:341px;top:351px}

.dot{position:absolute;left:166px;top:353px;width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;z-index:2;transition:transform .7s cubic-bezier(.65,0,.35,1),opacity .5s cubic-bezier(.65,0,.35,1);animation:dpop .8s cubic-bezier(.22,1,.36,1) 1.1s both}
.dot.gone{animation:none;transform:scale(.6);opacity:0;pointer-events:none}
@keyframes dpop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.boot .quad{animation:drop .9s cubic-bezier(.22,1,.36,1) both}
@keyframes drop{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}

/* ── text layers ── */
.layer{position:absolute;inset:0;padding:56px 30px 40px;box-sizing:border-box;display:flex;flex-direction:column;pointer-events:none;z-index:2}
.layer button,.layer .opt,.layer [data-tank]{pointer-events:auto}
.in{animation:in .8s cubic-bezier(.22,1,.36,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.h{font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-0.02em;margin:0}
.date{font-size:14px;color:#444;margin:6px 0 0}
.hint{font-size:15px;color:#444;margin:0 0 14px;text-align:center}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.pill{min-height:56px;border-radius:999px;border:none;background:#000;color:#fff;font-size:17px;width:100%;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.pill:active{transform:scale(.96)}
.pill.inv{background:var(--ink);color:var(--c)}
.tagline{position:absolute;left:0;right:0;top:500px;text-align:center;font-size:18px;color:#444;margin:0}

/* zoomed panel */
.panel{color:var(--ink)}
.top{display:flex;align-items:center;min-height:44px}
.bk{display:flex;align-items:center;gap:10px;border:none;background:none;padding:0;min-height:44px;font-size:15px;color:var(--ink)}
.bk i{width:30px;height:30px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center}
.bk i{color:var(--c)}
.pbar{position:relative;flex:1;height:6px;border-radius:3px;overflow:hidden;margin-left:12px}
.pbar::before{content:"";position:absolute;inset:0;background:var(--ink);opacity:.25}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:3px;transition:width .8s cubic-bezier(.65,0,.35,1)}
.pbar .p0{width:6%}.pbar .p1{width:25%}.pbar .p2{width:50%}.pbar .p3{width:75%}.pbar .p4{width:100%}
.mapgap{width:58px;flex:none}

.opts{display:grid;gap:8px;margin-top:24px}
.opts.sq3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:calc(.75 * (100vh - 384px) + 16px);margin-left:auto;margin-right:auto}
.opts.sq3 .opt{height:auto;min-height:0 !important;aspect-ratio:1;min-width:0;font-size:15px;padding:8px;overflow-wrap:anywhere}
.pgrid{position:relative}
.owngrid{margin-top:8px}.owngrid:empty{display:none}
.opts.sq4{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opts.sq4 .opt{height:auto;min-height:0 !important;aspect-ratio:1;min-width:0;font-size:13px;padding:6px;overflow-wrap:anywhere}
.opts.sq4 .opt .ck{top:5px;right:5px;width:18px;height:18px}
.own{position:absolute;left:calc(33.333% - 1.333px);top:50%;translate:-50% -50%;width:84px;height:84px;box-sizing:border-box;border-radius:50%;border:5px solid var(--c);background:#fff;color:#000;font-size:12px;line-height:1.15;padding:6px;z-index:2;animation:rise .6s cubic-bezier(.22,1,.36,1) .9s both;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.own:active{scale:.94}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);pointer-events:auto;animation:fadein .3s ease both;z-index:5}
.sheet{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,520px);box-sizing:border-box;bottom:0;padding-bottom:calc(34px + env(safe-area-inset-bottom,0px));background:#fff;color:#000;border-radius:22px 22px 0 0;padding:24px 24px 34px;display:flex;flex-direction:column;gap:12px;pointer-events:auto;z-index:6;animation:sheetup .45s cubic-bezier(.22,1,.36,1) both}
.sheet label{font-size:22px;line-height:1.2}
.sheet input{font:inherit;font-size:19px;min-height:56px;border:1.5px solid #000;border-radius:12px;padding:0 16px;outline:none;color:#000;background:#fff}
.sheet input:focus-visible{box-shadow:0 0 0 3px rgba(0,0,0,.2)}
.sheet-row{display:flex;gap:10px;align-items:center}
.sheet-row .pill{flex:1;background:#000;color:#fff}
.sheet-cancel{min-height:56px;padding:0 18px;border:none;background:none;font-size:16px;text-decoration:underline;color:#000}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetup{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{position:relative;height:84px;border-radius:8px;border:none;font-size:15px;line-height:1.2;padding:8px;color:var(--ink);background:rgba(255,255,255,.18);transition:background-color .25s,color .25s,transform .2s cubic-bezier(.2,.8,.2,1);animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.k-mind .opt,.k-body .opt{background:rgba(255,255,255,.5)}
.opts.c2 .opt{height:112px;font-size:17px}
.opt.wide{grid-column:1 / -1;height:64px !important}
.opt:active{transform:scale(.95)}
.opt.on{background:var(--ink);color:var(--c)}
.opt.on::after{content:"";position:absolute;inset:0;border-radius:8px;animation:ring .6s ease-out}
@keyframes ring{from{box-shadow:0 0 0 0 var(--ink)}to{box-shadow:0 0 0 14px transparent}}
.opt .ck{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--c);display:none;align-items:center;justify-content:center}
.opt.on .ck{display:flex;animation:ckin .35s cubic-bezier(.22,1,.36,1) both}
.opt .ck{color:var(--ink)}
@keyframes ckin{from{transform:scale(.4);opacity:0}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.opt:nth-child(1){animation-delay:.42s}.opt:nth-child(2){animation-delay:.46s}.opt:nth-child(3){animation-delay:.5s}.opt:nth-child(4){animation-delay:.54s}.opt:nth-child(5){animation-delay:.58s}.opt:nth-child(6){animation-delay:.62s}.opt:nth-child(7){animation-delay:.66s}.opt:nth-child(8){animation-delay:.7s}.opt:nth-child(9){animation-delay:.74s}.opt:nth-child(10){animation-delay:.78s}.opt:nth-child(11){animation-delay:.82s}.opt:nth-child(12){animation-delay:.86s}
.mindwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.dgrid{flex:1;min-height:0;margin:20px 0 14px;display:flex;flex-direction:column;gap:6px;touch-action:none;cursor:crosshair;outline:none;pointer-events:auto}
.dgrid:focus-visible{box-shadow:0 0 0 3px var(--ink);border-radius:8px}
.drow{flex:1;min-height:0;display:grid;grid-template-columns:76px repeat(4,minmax(0,1fr));gap:6px;align-items:stretch;border-radius:8px}
.drow.kf{box-shadow:0 0 0 2px var(--ink)}
.dlab{align-self:center;font-size:13px;color:var(--ink)}
.dc{border-radius:7px;background:rgba(255,255,255,.5);transition:background-color .2s}
.dc.on{animation:fillpop .4s cubic-bezier(.33,0,.2,1)}
.dc.on.solid{background:var(--ink)}
.dc.on.flicker,.sw.flicker{background:radial-gradient(var(--ink) 2.2px,transparent 2.7px) 0 0/9px 9px,rgba(255,255,255,.5)}
.dc.on.flicker{animation:fillpop .4s cubic-bezier(.33,0,.2,1),flick 1.8s ease-in-out .4s infinite alternate}
@keyframes flick{0%,40%{opacity:1}55%{opacity:.45}70%{opacity:.9}100%{opacity:.6}}
.dc.on.heavy,.sw.heavy{background:repeating-linear-gradient(135deg,var(--ink) 0 4px,rgba(255,255,255,.5) 4px 9px)}
.sw.solid{background:var(--ink)}
.brushes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.brush{min-height:48px;border-radius:999px;border:1.5px solid transparent;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink);transition:border-color .2s,background-color .2s}
.brush.on{border-color:var(--ink);background:rgba(255,255,255,.85)}
.brush .sw{width:18px;height:18px;border-radius:4px;display:block;flex:none}
.readout{font-size:15px;line-height:1.35;color:var(--ink);margin:12px 0 12px;height:5.4em;overflow:hidden}
.readout:empty::before{content:"Drag down the grid to draw your day";opacity:.7}
.tank{flex:1;min-height:0;margin:24px 0 16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:6px;touch-action:none;cursor:pointer;outline:none;border-radius:10px}
.tank:focus-visible{box-shadow:0 0 0 3px var(--ink)}
.tb{flex:1;border-radius:8px;background:rgba(255,255,255,.5);transition:background-color .25s cubic-bezier(.65,0,.35,1)}
.tb.on{background:var(--ink);animation:fillpop .45s cubic-bezier(.33,0,.2,1)}
@keyframes fillpop{0%{scale:.7 .7}45%{scale:1.04 1.08}75%{scale:.99 .98}100%{scale:1 1}}
.tank.full .tb{animation:wave .7s cubic-bezier(.33,0,.2,1) both}
.tank.full .tb:nth-child(2){animation-delay:0.00s}.tank.full .tb:nth-child(3){animation-delay:0.00s}.tank.full .tb:nth-child(4){animation-delay:0.00s}.tank.full .tb:nth-child(5){animation-delay:0.06s}.tank.full .tb:nth-child(6){animation-delay:0.06s}.tank.full .tb:nth-child(7){animation-delay:0.06s}.tank.full .tb:nth-child(8){animation-delay:0.06s}.tank.full .tb:nth-child(9){animation-delay:0.12s}.tank.full .tb:nth-child(10){animation-delay:0.12s}.tank.full .tb:nth-child(11){animation-delay:0.12s}.tank.full .tb:nth-child(12){animation-delay:0.12s}.tank.full .tb:nth-child(13){animation-delay:0.18s}.tank.full .tb:nth-child(14){animation-delay:0.18s}.tank.full .tb:nth-child(15){animation-delay:0.18s}.tank.full .tb:nth-child(16){animation-delay:0.18s}.tank.full .tb:nth-child(17){animation-delay:0.24s}.tank.full .tb:nth-child(18){animation-delay:0.24s}.tank.full .tb:nth-child(19){animation-delay:0.24s}.tank.full .tb:nth-child(20){animation-delay:0.24s}
@keyframes wave{0%{scale:1 1}30%{scale:1.06 .9}60%{scale:.97 1.04}100%{scale:1 1}}
.tread{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;margin-bottom:16px;color:var(--ink)}
.tread .big{font-size:34px;line-height:1.05;letter-spacing:-0.02em;min-height:36px;white-space:nowrap}
.tread .hint{font-size:15px;opacity:.75}
.lvs .opt{height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:17px;text-align:left}
.bars{display:flex;gap:4px}.bars b{width:8px;height:22px;border-radius:2px;background:currentColor;opacity:.25;display:block}.bars b.f{opacity:1}
.also{font-size:14px;margin:20px 0 0;opacity:.85}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.chips .opt{height:58px}

/* day + week */
.poster-cap{position:absolute;left:55px;right:55px;top:506px;display:flex;justify-content:space-between;font-size:13px;color:#444}
.weekrow{position:absolute;left:30px;right:30px;top:330px;display:grid;grid-template-columns:repeat(7,40px);justify-content:space-between}
.mini{width:40px;height:40px;display:grid;grid-template-columns:1fr 1fr;gap:2px;animation:in .5s ease both}
.mini b{display:block;border-radius:2px;background:var(--c)}
.mini b.split{background:linear-gradient(var(--c),var(--c)) 0 0/100% 45% no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/100% 45% no-repeat}
.mini b.off{background:#EDEDED}
.wk{position:absolute;left:30px;right:30px;top:378px;display:grid;grid-template-columns:repeat(7,40px);justify-content:space-between;font-size:12px;color:#666;text-align:center}
.notice{position:absolute;left:30px;right:30px;top:430px;border-top:1px solid #000;padding-top:14px;font-size:16px;line-height:1.4}
.notice small{display:block;font-size:12px;color:#666;margin-bottom:4px}
.toast{align-self:center;background:#000;color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;margin-bottom:10px;animation:in .4s ease both}


/* ── colour screens: white page, colour only on what you pick (from Figma) ── */
.k-pain,.k-heart{--on:#fff}.k-mind,.k-body{--on:#000}
.quad.s-full{background-color:#fff;transition:left 1s cubic-bezier(.65,0,.35,1),top 1s cubic-bezier(.65,0,.35,1),width 1s cubic-bezier(.65,0,.35,1),height 1s cubic-bezier(.65,0,.35,1),border-radius 1s cubic-bezier(.65,0,.35,1),background-color .5s ease .75s}
.layer.panel{--ink:#000;color:#000}
.layer.panel .bk i{background:#000;color:#fff}
.layer.panel .pbar::before{background:#DCDCDC;opacity:1}
.layer.panel .pbar i{background:var(--c)}
.layer.panel .pill.inv{background:#000;color:#fff}
.layer.panel .opt{background:#F1F2F4;color:#000}
.layer.panel .opt.on{background:var(--c);color:var(--on)}
.layer.panel.k-mind .opt.on,.layer.panel.k-body .opt.on{box-shadow:inset 0 0 0 1.5px #000}
.layer.panel .opt.on::after{animation:ringc .6s ease-out}
@keyframes ringc{from{box-shadow:0 0 0 0 var(--c)}to{box-shadow:0 0 0 14px transparent}}
.layer.panel .opt .ck{background:var(--on);color:var(--c)}
.layer.panel.k-mind .opt .ck,.layer.panel.k-body .opt .ck{background:#000;color:#fff}
.layer.panel .tb{background:#F1F2F4}
.layer.panel{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px)) !important}
.layer.panel .tank{margin:20px 0 14px}
.layer.panel .tread{margin-bottom:0}
.donebar{margin-top:auto;padding-top:16px;flex:none}
.layer.panel .tb.on{background:var(--c);box-shadow:inset 0 0 0 1.5px #000}
.layer.panel .opts.sq3{gap:10px;max-width:none;width:100%}
.layer.panel [data-k="zBody"],.layer.panel [data-k="zHeart"],.layer.panel [data-k="zPain"]{flex:1;min-height:0;display:flex;flex-direction:column}
.layer.panel .pgrid{flex:1 1 auto;min-height:0;grid-template-rows:repeat(4,minmax(0,1fr))}
.layer.panel .pgrid.g3{grid-template-rows:repeat(3,minmax(0,1fr))}
.layer.panel .pgrid .opt{aspect-ratio:auto;height:auto}
.layer.panel .pgrid .own{aspect-ratio:1;height:100%;width:auto;max-width:100%;justify-self:center;align-self:center}
.layer.panel .opts.sq3 .opt{font-size:14px;line-height:1.2;padding:6px;overflow-wrap:normal;word-break:normal;hyphens:manual}
.own{position:relative;left:auto;top:auto;translate:none;width:auto;height:auto;aspect-ratio:1;min-width:0;border:none;border-radius:50%;background:var(--c);color:var(--on);font-size:15px;padding:8px;z-index:1}
.own{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.own small{font-size:11px;opacity:.85;display:none}
.own.has small{display:none}
.own.has .ownt{font-size:15px;line-height:1.15;max-width:86%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.own .ck{position:absolute;top:6%;right:6%;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--c);display:none;align-items:center;justify-content:center}
.own.has .ck{display:flex;animation:ckin .35s cubic-bezier(.22,1,.36,1) both}
.own.has{box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--c);animation:jelly .7s cubic-bezier(.33,0,.2,1)}
.ownchips{display:flex;flex-wrap:wrap;gap:8px}
.ownchip{min-height:44px;padding:0 14px;border-radius:999px;border:none;background:var(--c,#3F5BD3);color:#fff;font-size:16px;display:flex;align-items:center;gap:8px}
.ownchip span{font-size:20px;line-height:1;opacity:.9}
.cells.egrid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:3px}
.cells.egrid .cell{border-radius:3px}
.cells.egrid .cell.off{background:#F6F8EC;box-shadow:none}
.s-week .cells.egrid .cell{box-shadow:none;border-radius:0}
.s-week .cells.egrid{gap:0}
.cells.patch{display:block;background:#fff}
.cells.patch .cell{position:absolute;padding:0}
.s-day .cells.patch .cell,.s-week .cells.patch .cell{padding:0}

/* option layout */
.opt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.osub{font-size:11px;line-height:1.1;opacity:.9}.osub:empty{display:none}
.hint2{font-size:13px;color:#555;margin:8px 0 0}.hint2:empty{display:none}
.layer.panel .opt .onm,.layer.panel .opt .osub{position:relative;z-index:1}

/* feelings: tile fills from the bottom with intensity */
.layer.panel .opt.feel{overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.layer.panel .opt.feel::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--f,0%);background:var(--c);transition:height .35s cubic-bezier(.22,1,.36,1);z-index:0}
.layer.panel .opt.feel.on{background:#FADCDD;color:#000}
.layer.panel .opt.feel.on.hi{color:#fff}
.layer.panel.k-body .opt.feel.on{background:#ECE6FC}
.layer.panel.k-body .opt.feel.on.hi{color:#000}
.layer.panel.k-body .opt.feel.on{box-shadow:none}
.layer.panel .opt.feel .onm,.layer.panel .opt.feel .osub{position:relative;z-index:1}
.layer.panel .opt.feel .osub{font-size:12px;font-variant-numeric:tabular-nums}
.layer.panel .opt.feel .ck,.layer.panel .opt.feel .osub{display:none !important}

/* body: groups first, then the symptoms inside */
.catgrid{position:relative;flex:1 1 auto;min-height:0;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.cat{position:relative;border:none;border-radius:10px;background:#F1F2F4;color:#000;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;overflow:hidden;animation:rise .6s cubic-bezier(.22,1,.36,1) both;transition:background-color .25s,transform .2s}
.cat:nth-child(2){animation-delay:0.05s}.cat:nth-child(3){animation-delay:0.10s}.cat:nth-child(4){animation-delay:0.15s}.cat:nth-child(5){animation-delay:0.20s}.cat:nth-child(6){animation-delay:0.25s}.cat:nth-child(7){animation-delay:0.30s}
.cat:active{transform:scale(.97)}
.cat .cname{font-size:17px;line-height:1.15;position:relative;z-index:1}
.cat .csub{font-size:12px;line-height:1.3;color:#444;position:relative;z-index:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat.has{background:#ECE6FC}
.cat .cmarks{position:absolute;left:12px;right:12px;bottom:10px;height:28%;display:flex;gap:4px;align-items:flex-end}
.cat .cmarks i{flex:1;max-width:26px;background:var(--c);border-radius:3px;display:block}
.cat:nth-child(7){grid-column:1 / -1}
.catgrid .own{position:relative;left:auto;top:auto;translate:none;width:auto;height:100%;max-width:100%;aspect-ratio:1;justify-self:center;align-self:center;border:none;box-sizing:border-box}
.catwrap{display:flex;flex-direction:column;flex:1;min-height:0;animation:in .5s cubic-bezier(.22,1,.36,1) both}
.catback{align-self:flex-start;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;margin-top:14px;border:none;border-radius:999px;background:#F1F2F4;font-size:15px;color:#000}
.subgrid{margin-top:12px}

/* body groups: 3 on top, 1 · circle · 1, then 2 centred */
.layer.panel .cat7{grid-template-columns:repeat(6,minmax(0,1fr))}
.layer.panel .cat7 > *{grid-column:span 2}
.layer.panel .cat7 > :nth-child(7){grid-column:2 / span 2}
.layer.panel .cat7 .opt{animation:rise .6s cubic-bezier(.22,1,.36,1) both}

/* body groups: 3 across, circle in the centre, aligned to both edges */
.layer.panel .brick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:10px;row-gap:10px;margin-top:20px;width:100%;max-width:none !important}
.layer.panel .brick > *{aspect-ratio:1;height:auto;min-height:0 !important;min-width:0}
.layer.panel .brick > :nth-child(1){grid-row:1;grid-column:1}
.layer.panel .brick > :nth-child(2){grid-row:1;grid-column:2}
.layer.panel .brick > :nth-child(3){grid-row:1;grid-column:3}
.layer.panel .brick > :nth-child(4){grid-row:2;grid-column:1}
.layer.panel .brick > :nth-child(5){grid-row:2;grid-column:2}
.layer.panel .brick > :nth-child(6){grid-row:2;grid-column:3}
.layer.panel .brick > :nth-child(7){grid-row:3;grid-column:1}
.layer.panel .brick > :nth-child(8){grid-row:3;grid-column:3}
.layer.panel .brick .opt{font-size:14px;line-height:1.15;padding:6px;animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.layer.panel .brick .own{position:relative;left:auto;top:auto;translate:none;width:100%;height:auto;font-size:14px;animation:rise .6s cubic-bezier(.22,1,.36,1) .3s both}
.layer.panel .brick > :nth-child(6){animation-delay:.12s}.layer.panel .brick > :nth-child(7){animation-delay:.16s}.layer.panel .brick > :nth-child(8){animation-delay:.2s}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;transition-duration:1ms !important;transition-delay:0ms !important}}

<script>
const SVGNS="http://www.w3.org/2000/svg";
class DCLogic{constructor(p){this.props=p;this.state=null}setState(x){this.state=Object.assign({},this.state||{},x);schedule()}}
function ev(scope,expr){try{return Function(...Object.keys(scope),'return ('+expr.trim()+')')(...Object.values(scope))}catch(e){return undefined}}

   if(a.name.toLowerCase()==='onclick'){el.__click=ev(scope,strip(a.value));continue}
   el.setAttribute(a.name,bindText(a.value,scope))}
  build(n,scope,el,isSvg);parent.appendChild(el)}
}
function sameNode(a,b){if(a.nodeType!==b.nodeType)return false;if(a.nodeType===3)return true;if(a.nodeName!==b.nodeName)return false;
 const ka=a.getAttribute('data-k'),kb=b.getAttribute('data-k');if(ka!==kb)return false;
 const la=(a.getAttribute('class')||'').split(' ')[0],lb=(b.getAttribute('class')||'').split(' ')[0];return la===lb}
function morph(oldP,newP){
 const o=[...oldP.childNodes],n=[...newP.childNodes];
 for(let i=0;i<n.length;i++){
  const nn=n[i],on=o[i];
  if(!on){oldP.appendChild(nn);continue}
  if(!sameNode(on,nn)){oldP.replaceChild(nn,on);continue}
  if(on.nodeType===3){if(on.nodeValue!==nn.nodeValue)on.nodeValue=nn.nodeValue;continue}
  for(const a of [...on.attributes])if(!nn.hasAttribute(a.name))on.removeAttribute(a.name);
  for(const a of [...nn.attributes])if(on.getAttribute(a.name)!==a.value)on.setAttribute(a.name,a.value);
  on.__click=nn.__click;
  morph(on,nn)}
 for(let i=o.length-1;i>=n.length;i--)oldP.removeChild(o[i]);
}


let fd=null,feelSlid=false;

  renderVals() {
